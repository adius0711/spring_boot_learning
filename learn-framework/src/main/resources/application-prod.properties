logging.level.org.springframework=info

currency-service.url=http://prod.learnspringboot.com
currency-service.username=prodUsername
currency-service.key=prodKey

# By giving the endpoint "/actuator" like "http://localhost:8080/actuator", the below property will expose all end points
management.endpoints.web.exposure.include=*

# Connect to H2 database
spring.h2.console.enabled=true

# This property allows h2 url to remain static.
spring.datasource.url=jdbc:h2:mem:test